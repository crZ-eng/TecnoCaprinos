<!DOCTYPE html>
<html lang="es">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TecnoCaprinos - Editar</title>
    <link rel="icon" href="{% static 'logo.jpeg' %}">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-principal: #C9A06D;
            --bg-cuadros: #EAD4B8;
            --color-trazos: #7F5637;
            --white: #f8f8f8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background: var(--bg-principal);
            min-height: 100vh;
        }

        /* HEADER */

        .white-header {
            width: 100%;
            background: var(--white);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 40px;
            border-bottom: 4px solid var(--color-trazos);
            box-shadow: 0 4px 15px rgba(0,0,0,.12);
        }

        .logo-container img {
            height: 65px;
            border-radius: 12px;
        }

        .header-title {
            font-size: 2.4rem;
            color: var(--bg-cuadros);
            -webkit-text-stroke: 1.5px var(--color-trazos);
            letter-spacing: 2px;
        }

        /* CONTENIDO */

        .page-content {
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .form-container {
            width: 100%;
            max-width: 950px;
            background: var(--bg-cuadros);
            border: 5px solid var(--color-trazos);
            border-radius: 35px;
            padding: 35px;
            box-shadow:
                0 12px 30px rgba(0,0,0,.15),
                inset 0 2px 0 rgba(255,255,255,.4);
        }

        .form-title {
            text-align: center;
            font-size: 2.2rem;
            color: var(--white);
            -webkit-text-stroke: 1.4px var(--color-trazos);
            margin-bottom: 35px;
        }

        /* GRID */

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        /* CAMPOS */

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            color: var(--color-trazos);
            font-weight: 600;
            margin-bottom: 7px;
            margin-left: 5px;
        }

        .form-group h1 {
            background: var(--white);
            border: 3px solid var(--color-trazos);
            border-radius: 15px;
            min-height: 52px;
            display: flex;
            align-items: center;
            padding: 0 15px;
            font-size: 1rem;
            color: var(--color-trazos);
            font-weight: 500;
            overflow-wrap: break-word;
        }

        input,
        select,
        textarea {
            width: 100%;
            background: var(--white);
            border: 3px solid var(--color-trazos);
            border-radius: 15px;
            padding: 12px 15px;
            font-size: .95rem;
            font-family: 'Fredoka', sans-serif;
            color: var(--color-trazos);
            transition: .25s ease;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--color-trazos);
            box-shadow: 0 0 0 4px rgba(127,86,55,.15);
            transform: translateY(-1px);
        }

        input::placeholder {
            color: rgba(127,86,55,.7);
        }

        /* BOTONES */

        .btn-submit,
        .btn-volver {
            grid-column: span 2;
            text-align: center;
            text-decoration: none;
            padding: 14px;
            border-radius: 18px;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Fredoka', sans-serif;
            transition: .25s ease;
            cursor: pointer;
        }

        .btn-submit {
            border: none;
            background: var(--color-trazos);
            color: white;
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,.18);
        }

        .btn-volver {
            background: #ab7b41;
            color: white;
        }

        .btn-volver:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,.18);
        }

        /* RESPONSIVE */

        @media (max-width: 768px) {

            .white-header {
                padding: 12px 20px;
            }

            .header-title {
                font-size: 1.5rem;
            }

            .logo-container img {
                height: 45px;
            }

            .form-container {
                padding: 25px;
                border-radius: 25px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .btn-submit,
            .btn-volver {
                grid-column: span 1;
            }
        }

        @media (max-width: 480px) {

            .form-title {
                font-size: 1.6rem;
            }

            .header-title {
                font-size: 1.1rem;
            }

            .form-container {
                padding: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="white-header">
        <div class="logo-container">
            <img src="{% static 'logo.jpeg' %}" alt="Logo TecnoCaprinos">
        </div>
        <h1 class="header-title">TECNOCAPRINOS</h1>
        <div style="width: 60px;" class="header-spacer"></div>
    </div>
    <div class="page-content">
        <div class="form-container">
            <h3 class="form-title">Edita los Datos de tu Cabra</h3>
            <form method="POST" class="form-grid">
                {% csrf_token %}
                <div class="form-group">
                    <label>Codigo:</label>
                    <h1>{{ cabra.codigo }}</h1>
                    <input type="hidden" name="codigo" value="{{ cabra.codigo }}">
                </div>
                <div class="form-group">
                    <label>Nombre:</label>
                    <h1>{{ cabra.nombre }}</h1>
                    <input type="hidden" name="nombre" value="{{ cabra.nombre }}">
                </div>
                <div class="form-group">
                    <label>Fecha de Nacimiento:</label>
                    <h1>{{ cabra.fecha_nacimiento }}</h1>
                    <input type="hidden" name="fecha_nacimiento" value="{{ cabra.fecha_nacimiento }}">
                </div>
                <div class="form-group">
                    <label>Raza:</label>
                    <h1>{{ cabra.raza }}</h1>
                    <input type="hidden" name="raza" value="{{ cabra.raza }}">
                </div>
                <div class="form-group">
                    <label>Peso (en Libras):</label>
                    <h1>{{ cabra.peso }}</h1>
                    <input type="hidden" name="peso" value="{{ cabra.peso }}">
                </div>
                <div class="form-group">
                    <label>Color:</label>
                    <h1>{{ cabra.color }}</h1>
                    <input type="hidden" name="color" value="{{ cabra.color }}">
                </div>
                <div class="form-group">
                    <label>Codigo de la Madre:</label>
                    <h1>{{ cabra.codigo_madre }}</h1>
                    <input type="hidden" name="cod_madre" value="{{ cabra.codigo_madre }}">
                </div>
                <div class="form-group">
                    <label>Codigo del Padre:</label>
                    <h1>{{ cabra.codigo_padre }}</h1>
                    <input type="hidden" name="cod_padre" value="{{ cabra.codigo_padre }}">
                </div>
                <div class="form-group">
                    <label>Mes de Gestación:</label>
                    <select name="mes_gestacion">
                        <option value="{{ cabra.mes_gestacion }}">Mes {{ cabra.mes_gestacion }}</option>
                        <option value="1">Mes 1</option>
                        <option value="2">Mes 2</option>
                        <option value="3">Mes 3</option>
                        <option value="4">Mes 4</option>
                        <option value="5">Mes 5</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Estado de Gestación:</label>
                    <select name="estado_gestacion">
                        <option value="{{ cabra.estado_gestacion }}">{{ cabra.estado_gestacion }}</option>
                        <option value="Gestacion Temprana">Gestación temprana (0 - 50 días)</option>
                        <option value="Gestacion Media">Gestación media (51 - 100 días)</option>
                        <option value="Gestacion Avanzada">Gestación avanzada (101 - 150 días)</option>
                        <option value="Preparto">Preparto</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Peso Actual (lb):</label>
                    <input value="{{ cabra.peso_actual }}" type="text" name="peso_actual" placeholder="Peso Actual (en Libras)" required>
                </div>
                <div class="form-group">
                    <label>Veterinario Responsable:</label>
                    <input value="{{ cabra.veterinario_responsable }}" type="text" name="veterinario_responsable" placeholder="Veterinario Responsable" required>
                </div>
                <button type="submit" class="btn-submit">GUARDAR REGISTRO</button>
                <a href="{% url 'info_animales' %}" class="btn-volver">VOLVER</a>
            </form>
        </div>
    </div>
</body>
</html>
