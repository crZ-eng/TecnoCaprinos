<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña</title>
        <style>
        :root {
            --bg-principal: #C9A06D;
            --bg-cuadros: #EAD4B8;
            --color-trazos: #7F5637;
            --white: #f8f8f8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background-color: var(--bg-principal);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            width: 100%;
            background-color: var(--white);
            border-bottom: 4px solid var(--color-trazos);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 50px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            height: 65px;
        }

        .header-title {
            font-size: 2.3rem;
            color: var(--bg-cuadros);
            -webkit-text-stroke: 1.5px var(--color-trazos);
            text-transform: uppercase;
            font-weight: 600;
        }

        .welcome-user {
            color: var(--color-trazos);
            font-size: 1rem;
            font-weight: 600;
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .container form {
            width: 100%;
            max-width: 500px;
            background-color: var(--bg-cuadros);
            border: 6px solid var(--color-trazos);
            border-radius: 35px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,.15);
        }

        .container h2 {
            color: var(--white);
            font-size: 2.4rem;
            text-align: center;
            margin-bottom: 30px;
            -webkit-text-stroke: 1.5px var(--color-trazos);
            text-transform: uppercase;
        }

        input[type="email"] {
            width: 100%;
            padding: 14px 18px;
            border: 3px solid var(--color-trazos);
            border-radius: 18px;
            background: #fffaf3;
            color: var(--color-trazos);
            font-size: 1rem;
            font-family: 'Fredoka', sans-serif;
            outline: none;
            transition: .25s ease;
        }

        input[type="email"]:focus {
            background: white;
            transform: scale(1.01);
        }

        input::placeholder {
            color: #9b7756;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 20px;
            background-color: var(--color-trazos);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Fredoka', sans-serif;
            cursor: pointer;
            transition: .25s ease;
        }

        button:hover {
            transform: scale(1.02);
        }
        
        @media (max-width: 768px) {

            .header {
                justify-content: center;
                text-align: center;
                padding: 20px;
            }

            .header-left {
                flex-direction: column;
            }

            .logo {
                height: 55px;
            }

            .header-title {
                font-size: 1.7rem;
                -webkit-text-stroke: 1px var(--color-trazos);
            }

            .welcome-user {
                width: 100%;
            }

            .container form {
                padding: 30px 25px;
                border-width: 4px;
                border-radius: 28px;
            }

            .container h2 {
                font-size: 2rem;
            }
        }

        @media (max-width: 480px) {

            .header-title {
                font-size: 1.4rem;
            }

            .container h2 {
                font-size: 1.6rem;
            }

            .container form {
                padding: 25px 20px;
            }

            input[type="email"],
            button {
                font-size: .95rem;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <img src="{% static 'logo.jpeg' %}" alt="Logo TecnoCaprinos" class="logo">
        <h1 class="header-title">TECNOCAPRINOS</h1>
        <p class="welcome-user">Bienvenido/a</p>
    </div>
    <div class="container">
        <h2>Recuperar Contraseña</h2>
        <form method="POST">
            {% csrf_token %}
            <input type="email" name="email" placeholder="Correo electrónico" required>
            <button type="submit">Enviar enlace</button>
        </form>
    </div>
</body>
</html>
