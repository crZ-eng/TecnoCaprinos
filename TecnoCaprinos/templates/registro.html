<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ganado Digital - Registro</title>
    <link rel="icon" href="{% static 'logo.jpeg' %}">
    <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Besley&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background: #6f4a2d;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100vw;
            overflow-x: hidden;
        }

        .container {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 80px;
            width: 90%;
            max-width: 1300px;
            padding: 40px 0;
            box-sizing: border-box;
        }

        .register-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
        }

        form {
            background: #EAD4B8;
            padding: 40px 30px;
            border-radius: 35px;
            width: 320px;
            border: 8px solid #C9A06D;
            box-shadow: 0 20px 30px rgba(0,0,0,0.25);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        form h2 {
            text-align: center;
            color: #7F5637;
            font-family: 'Bagel Fat One', cursive;
            font-size: 30px;
            margin: 0;
        }

        input {
            width: 91%;
            padding: 14px;
            border-radius: 25px;
            border: none;
            background: #C9A06D;
            color: #7F5637;
            font-family: 'Besley', serif;
            font-size: 14px;
            outline: none;
        }

        input::placeholder {
            color: #7F5637;
            opacity: 0.7;
        }

        .btn {
            display: flex;
            justify-content: center;
            margin-top: 10px;
        }

        .btn button {
            background: #7F5637;
            color: #F2EDDF;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-family: 'Bagel Fat One', cursive;
            font-size: 16px;
            transition: 0.3s;
        }

        .links {
            margin-top: 20px;
            text-align: center;
        }

        .link {
            display: block;
            color: #F2EDDF;
            font-family: 'Besley', serif;
            text-decoration: none;
            margin: 5px 0;
            font-size: 14px;
        }

        .imagen {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
            max-width: 600px;
        }

        .imagen img {
            width: 100%;
            max-width: 550px;
            height: auto;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 50%;
            border: 10px solid #EAD4B8;
            box-shadow: 0 20px 30px rgba(0,0,0,0.2);
        }

        .TyC{
            display: grid;
            grid-template-columns: 10% auto;
        }

        @media (max-width: 1024px) {
            body {
                align-items: flex-start;
                overflow-y: auto;
            }

            .container {
                flex-direction: column-reverse;
                gap: 30px;
                padding: 30px 0;
            }

            .imagen {
                max-width: 100%;
                margin-top: 10px;
            }

            .imagen img {
                width: 180px;
                max-width: 180px;
                border: 6px solid #EAD4B8;
            }
        }

        @media (max-width: 480px) {
            .register-box {
                width: 290px;
            }
            form {
                padding: 25px 20px;
            }
            .imagen img {
                width: 150px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="register-box">
            <form method="POST">
                {% csrf_token %}
                <h2>Registrarse</h2>
                <input type="text" name="nombre" placeholder="Nombre completo" required>
                <input type="email" name="email" placeholder="Email" required>
                <input type="password" name="password" placeholder="Contraseña" required>
                <div class="TyC">
                    <input type="checkbox" name="TyC" required>
                    <label>Aceptas los <a href="https://drive.google.com/file/d/1olwwv9wg3CLY-PO5kbVN7JU4jvhyPTNy/view?usp=sharing">Terminos y Condiciones</a></label>
                </div>
                <div class="btn">
                    <button type="submit">registrarse</button>
                </div>
                {% if mensaje %}
                    <p style="color: red; text-align: center; font-size: 12px;">{{ mensaje }}</p>
                {% endif %}
            </form>
            <div class="links">
                <p class="link" style="color: #F2EDDF;">¿Ya tienes cuenta?</p>
                <a href="{% url 'login' %}" class="link" style="text-decoration: underline;">Inicia sesión aquí</a>
            </div>
        </div>
        <div class="imagen">
            <img src="{% static 'cabra_registro.jpg' %}" alt="cabra">
        </div>
    </div>
</body>
</html>
